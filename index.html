<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy INDAY</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            background: #111;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            width: 400px;
            max-width: 100vw;
            height: 600px;
            max-height: 100vh;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            border: 4px solid #333;
            border-radius: 12px;
            overflow: hidden;
            background: #70c5ce;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }

        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            text-align: center;
        }

        .hidden {
            display: none !important;
        }

        h1 {
            margin: 0 0 10px 0;
            font-size: 3rem;
            color: #f8e71c;
            text-shadow: 3px 3px 0px #d0021b, -2px -2px 0px #000;
            letter-spacing: 2px;
        }

        p {
            margin: 5px 0 20px 0;
            font-size: 1.2rem;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
        }

        .btn {
            pointer-events: auto;
            background: #f8e71c;
            color: #333;
            border: none;
            padding: 12px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 6px 0 #d0021b, 0 10px 20px rgba(0,0,0,0.4);
            transition: transform 0.1s, box-shadow 0.1s;
        }

        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #d0021b, 0 5px 10px rgba(0,0,0,0.4);
        }

        #score-board {
            background: rgba(0, 0, 0, 0.6);
            padding: 20px 30px;
            border-radius: 15px;
            border: 2px solid #555;
            margin-bottom: 20px;
            backdrop-filter: blur(5px);
        }

        .score-row {
            display: flex;
            justify-content: space-between;
            width: 180px;
            margin: 8px 0;
            font-size: 1.1rem;
        }

        .score-val {
            font-weight: bold;
            color: #f8e71c;
        }

        .instructions {
            font-size: 0.9rem;
            opacity: 0.8;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas" width="400" height="600"></canvas>

        <!-- Start Screen -->
        <div id="start-screen" class="ui-layer">
            <h1>FLAPPY INDAY</h1>
            <p>Tap, Space, or Click to Fly</p>
            <button class="btn" id="start-btn">PLAY</button>
            <div class="instructions">Avoid the pipes & don't hit the ground!</div>
        </div>

        <!-- Game Over Screen -->
        <div id="gameover-screen" class="ui-layer hidden">
            <h1>GAME OVER</h1>
            <div id="score-board">
                <div class="score-row"><span>Score:</span> <span id="final-score" class="score-val">0</span></div>
                <div class="score-row"><span>Best:</span> <span id="best-score" class="score-val">0</span></div>
            </div>
            <button class="btn" id="restart-btn">PLAY AGAIN</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const startScreen = document.getElementById('start-screen');
        const gameOverScreen = document.getElementById('gameover-screen');
        const startBtn = document.getElementById('start-btn');
        const restartBtn = document.getElementById('restart-btn');
        const finalScoreEl = document.getElementById('final-score');
        const bestScoreEl = document.getElementById('best-score');

        // Audio helper using Web Audio API
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playSound(type) {
            if (!audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                const now = audioCtx.currentTime;

                if (type === 'jump') {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(300, now);
                    osc.frequency.exponentialRampToValueAtTime(600, now + 0.1);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.linearRampToValueAtTime(0, now + 0.1);
                    osc.start(now);
                    osc.stop(now + 0.1);
                } else if (type === 'score') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(587.33, now); // D5
                    osc.frequency.setValueAtTime(880, now + 0.08); // A5
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.linearRampToValueAtTime(0, now + 0.2);
                    osc.start(now);
                    osc.stop(now + 0.2);
                } else if (type === 'hit') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(150, now);
                    osc.frequency.linearRampToValueAtTime(40, now + 0.2);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.linearRampToValueAtTime(0, now + 0.2);
                    osc.start(now);
                    osc.stop(now + 0.2);
                }
            } catch (e) {
                console.error(e);
            }
        }

        // Game States
        const STATE_START = 0;
        const STATE_PLAYING = 1;
        const STATE_GAMEOVER = 2;
        let gameState = STATE_START;

        // Game Variables
        let score = 0;
        let highscore = localStorage.getItem('flappy_highscore') || 0;
        let frames = 0;

        // Bird Object
        const bird = {
            x: 80,
            y: 250,
            radius: 14,
            gravity: 0.28,
            lift: -6.2,
            velocity: 0,
            rotation: 0,

            update() {
                this.velocity += this.gravity;
                this.y += this.velocity;

                // Rotation based on velocity
                if (this.velocity >= 0) {
                    this.rotation = Math.min(Math.PI / 2, this.rotation + 0.08);
                } else {
                    this.rotation = -0.4;
                }

                // Floor collision
                const floorY = canvas.height - 100;
                if (this.y + this.radius >= floorY) {
                    this.y = floorY - this.radius;
                    triggerGameOver();
                }

                // Ceiling collision
                if (this.y - this.radius <= 0) {
                    this.y = this.radius;
                    this.velocity = 0;
                }
            },

            jump() {
                this.velocity = this.lift;
                this.rotation = -0.4;
                playSound('jump');
            },

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);

                // Body
                ctx.fillStyle = '#f8e71c';
                ctx.beginPath();
                ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#333';
                ctx.lineWidth = 2;
                ctx.stroke();

                // Wing
                ctx.fillStyle = '#f5a623';
                ctx.beginPath();
                ctx.ellipse(-3, 2, 6, 4, 0.2, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                // Eye
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(6, -4, 5, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                ctx.fillStyle = '#000';
                ctx.beginPath();
                ctx.arc(7, -4, 2, 0, Math.PI * 2);
                ctx.fill();

                // Beak
                ctx.fillStyle = '#f5a623';
                ctx.beginPath();
                ctx.moveTo(10, -2);
                ctx.lineTo(18, 1);
                ctx.lineTo(10, 5);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                ctx.restore();
            }
        };

        // Pipes Management
        let pipes = [];
        const pipeWidth = 60;
        const pipeGap = 150;
        const pipeSpeed = 2.5;

        class Pipe {
            constructor() {
                this.x = canvas.width;
                // Random height between 80 and canvas.height - 250
                const minHeight = 60;
                const maxHeight = canvas.height - 220 - pipeGap;
                this.topHeight = Math.floor(Math.random() * (maxHeight - minHeight + 1)) + minHeight;
                this.bottomY = this.topHeight + pipeGap;
                this.passed = false;
            }

            update() {
                this.x -= pipeSpeed;
            }

            draw() {
                // Top Pipe
                ctx.fillStyle = '#73bf2e';
                ctx.fillRect(this.x, 0, pipeWidth, this.topHeight);
                ctx.strokeStyle = '#333';
                ctx.lineWidth = 2;
                ctx.strokeRect(this.x, 0, pipeWidth, this.topHeight);
                // Top Pipe Lip
                ctx.fillRect(this.x - 4, this.topHeight - 24, pipeWidth + 8, 24);
                ctx.strokeRect(this.x - 4, this.topHeight - 24, pipeWidth + 8, 24);

                // Bottom Pipe
                const bottomHeight = canvas.height - 100 - this.bottomY;
                ctx.fillStyle = '#73bf2e';
                ctx.fillRect(this.x, this.bottomY, pipeWidth, bottomHeight);
                ctx.strokeRect(this.x, this.bottomY, pipeWidth, bottomHeight);
                // Bottom Pipe Lip
                ctx.fillRect(this.x - 4, this.bottomY, pipeWidth + 8, 24);
                ctx.strokeRect(this.x - 4, this.bottomY, pipeWidth + 8, 24);
            }
        }

        // Background elements (clouds, city skyline silhouette)
        let backgroundX = 0;
        let groundX = 0;

        function drawBackground() {
            // Sky gradient background handled by container/canvas clear
            ctx.fillStyle = '#70c5ce';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Clouds (parallax)
            ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
            const cloudOffset = (frames * 0.5) % (canvas.width + 100);
            drawCloud(100 - cloudOffset, 120);
            drawCloud(320 - cloudOffset, 80);
            drawCloud(550 - cloudOffset, 150);

            // City Skyline Silhouette
            ctx.fillStyle = '#5599a0';
            let skylineX = -(frames * 1) % 200;
            for (let i = -1; i < 4; i++) {
                let sx = skylineX + (i * 200);
                ctx.fillRect(sx, canvas.height - 180, 50, 80);
                ctx.fillRect(sx + 55, canvas.height - 220, 70, 120);
                ctx.fillRect(sx + 130, canvas.height - 160, 60, 60);
            }
        }

        function drawCloud(x, y) {
            ctx.beginPath();
            ctx.arc(x, y, 20, 0, Math.PI * 2);
            ctx.arc(x + 15, y - 10, 15, 0, Math.PI * 2);
            ctx.arc(x + 30, y, 18, 0, Math.PI * 2);
            ctx.closePath();
            ctx.fill();
        }

        function drawGround() {
            const groundHeight = 100;
            const groundY = canvas.height - groundHeight;

            // Grass top strip
            ctx.fillStyle = '#5ee270';
            ctx.fillRect(0, groundY, canvas.width, 16);
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, groundY);
            ctx.lineTo(canvas.width, groundY);
            ctx.stroke();

            // Dirt/Mud base with scrolling stripes
            ctx.fillStyle = '#d58f4c';
            ctx.fillRect(0, groundY + 16, canvas.width, groundHeight - 16);
            
            ctx.fillStyle = '#c07b38';
            groundX = (groundX + pipeSpeed) % 30;
            for (let i = -1; i < canvas.width / 30 + 2; i++) {
                let gx = i * 30 - groundX;
                ctx.beginPath();
                ctx.moveTo(gx, groundY + 16);
                ctx.lineTo(gx + 15, groundY + groundHeight);
                ctx.lineTo(gx + 22, groundY + groundHeight);
                ctx.lineTo(gx + 7, groundY + 16);
                ctx.closePath();
                ctx.fill();
            }

            // Ground top/bottom borders
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, groundY + 16);
            ctx.lineTo(canvas.width, groundY + 16);
            ctx.moveTo(0, canvas.height);
            ctx.lineTo(canvas.width, canvas.height);
            ctx.stroke();
        }

        function triggerGameOver() {
            if (gameState === STATE_GAMEOVER) return;
            gameState = STATE_GAMEOVER;
            playSound('hit');

            if (score > highscore) {
                highscore = score;
                localStorage.setItem('flappy_highscore', highscore);
            }

            finalScoreEl.textContent = score;
            bestScoreEl.textContent = highscore;
            gameOverScreen.classList.remove('hidden');
        }

        function resetGame() {
            bird.y = 250;
            bird.velocity = 0;
            bird.rotation = 0;
            pipes = [];
            score = 0;
            frames = 0;
            gameOverScreen.classList.add('hidden');
            startScreen.classList.add('hidden');
            gameState = STATE_PLAYING;
        }

        // Input Handlers
        function handleInput(e) {
            if (e.type === 'keydown' && e.code !== 'Space') return;
            if (e.type === 'keydown') e.preventDefault();

            initAudio();

            if (gameState === STATE_START) {
                resetGame();
            } else if (gameState === STATE_PLAYING) {
                bird.jump();
            } else if (gameState === STATE_GAMEOVER) {
                // Prevent immediate restart if clicking buttons directly handled by button events
            }
        }

        window.addEventListener('keydown', handleInput);
        canvas.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            if (gameState === STATE_PLAYING) {
                initAudio();
                bird.jump();
            }
        });

        startBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            initAudio();
            resetGame();
        });

        restartBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            initAudio();
            resetGame();
        });

        // Main Game Loop
        function loop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            drawBackground();

            if (gameState === STATE_START) {
                // Gentle floating bird animation on start screen
                bird.y = 250 + Math.sin(Date.now() / 200) * 8;
                bird.rotation = 0;
                bird.draw();
            } else if (gameState === STATE_PLAYING) {
                frames++;

                // Spawn pipes every 100 frames
                if (frames % 100 === 0) {
                    pipes.push(new Pipe());
                }

                // Update & Draw Pipes
                for (let i = pipes.length - 1; i >= 0; i--) {
                    pipes[i].update();
                    pipes[i].draw();

                    // Score check
                    if (!pipes[i].passed && pipes[i].x + pipeWidth < bird.x) {
                        score++;
                        pipes[i].passed = true;
                        playSound('score');
                    }

                    // Collision Detection
                    const hitTopPipe = bird.x + bird.radius > pipes[i].x && 
                                       bird.x - bird.radius < pipes[i].x + pipeWidth && 
                                       bird.y - bird.radius < pipes[i].topHeight;

                    const hitBottomPipe = bird.x + bird.radius > pipes[i].x && 
                                          bird.x - bird.radius < pipes[i].x + pipeWidth && 
                                          bird.y + bird.radius > pipes[i].bottomY;

                    if (hitTopPipe || hitBottomPipe) {
                        triggerGameOver();
                    }

                    // Remove off-screen pipes
                    if (pipes[i].x + pipeWidth < 0) {
                        pipes.splice(i, 1);
                    }
                }

                bird.update();
                bird.draw();

                // Draw live score
                ctx.fillStyle = '#fff';
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 4;
                ctx.font = 'bold 40px sans-serif';
                ctx.textAlign = 'center';
                ctx.strokeText(score, canvas.width / 2, 70);
                ctx.fillText(score, canvas.width / 2, 70);

            } else if (gameState === STATE_GAMEOVER) {
                // Draw frozen scene
                for (let pipe of pipes) {
                    pipe.draw();
                }
                bird.draw();
            }

            drawGround();

            requestAnimationFrame(loop);
        }

        // Initialize loop
        requestAnimationFrame(loop);
    </script>
</body>
</html>
